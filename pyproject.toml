[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-360"
version = "0.1.0"
description = "Local-first business risk and decision intelligence workbench"
requires-python = ">=3.12,<3.14"
dependencies = [
  "streamlit==1.66.1",
  "pandas==2.3.3",
  "numpy==2.3.5",
  "plotly==6.3.0",
  "openpyxl==3.1.5",
  "anyio==4.14.2",
  "certifi==2026.10.19",
  "cryptography==50.0.0",
  "idna==3.15",
  "pillow==13.0.0",
  "urllib3==2.8.0",
]

[project.optional-dependencies]
parquet = ["pyarrow==26.0.0"]
auth = ["Authlib==1.9.1"]
dev = ["pytest==8.4.2", "ruff==0.17.3", "pip-audit==2.10.1"]
security = ["pip-audit==2.10.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"
