[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-360"
version = "0.1.0"
description = "Local-first business risk and decision intelligence workbench"
requires-python = ">=3.12,<3.14"
dependencies = [
  "streamlit==1.51.0",
  "pandas==2.3.3",
  "numpy==2.3.5",
  "plotly==6.3.0",
  "openpyxl==3.1.5",
]

[project.optional-dependencies]
parquet = ["pyarrow==21.0.0"]
dev = ["pytest==8.4.2", "ruff==0.12.0", "pip-audit==2.10.1"]
security = ["pip-audit==2.10.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--basetemp=data/test-tmp"

[tool.ruff]
line-length = 100
target-version = "py310"
