name: Dependency security

on:
  schedule:
    - cron: "17 8 * * 1"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-production.lock
      - run: python -m pip install -c requirements-production.lock -e ".[dev,parquet,auth]"
      - run: python -m pip_audit -r requirements-production.lock --disable-pip --no-deps --progress-spinner off
